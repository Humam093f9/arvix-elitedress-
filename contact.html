<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="contact.page_title">تواصل معنا — ELITEDRESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark latin">E</span>
    <span class="brand-name latin">ELITEDRESS</span>
  </div>

  <button class="nav-toggle" id="navToggle" data-i18n-aria="nav.menu_aria" aria-label="فتح القائمة" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav id="mainNav">
    <ul>
      <li><a href="index.html" data-i18n="nav.home">الرئيسية</a></li>
      <li><a href="collection.html" data-i18n="nav.collection">المجموعة</a></li>
      <li><a href="about.html" data-i18n="nav.about">من نحن</a></li>
      <li><a href="contact.html" class="active" data-i18n="nav.contact">تواصل معنا</a></li>
      <li><a href="custom-order.html" data-i18n="nav.custom">فصّلي فستانك</a></li>
    </ul>
  </nav>

  <a href="#" class="icon-btn" id="headerWhatsapp" data-i18n-aria="nav.whatsapp_aria" aria-label="تواصل عبر واتساب" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M20.5 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3.5 20.5l1.4-4.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </a>
  <button type="button" class="icon-btn lang-toggle" id="langToggle" aria-label="Switch language">EN</button>
</header>

<section class="page-hero reveal-on-scroll">
  <p class="page-eyebrow" data-i18n="contact.eyebrow">ابقي على تواصل</p>
  <h1 data-i18n="nav.contact">تواصل معنا</h1>
  <p data-i18n="contact.subtitle">تابعينا أو تواصلي معنا مباشرة عبر أي من المنصات التالية.</p>
</section>

<div class="social-grid" id="socialGrid">
  <p class="empty-state" data-i18n="contact.loading">جاري التحميل...</p>
</div>

<div class="about-contact" style="max-width:760px;margin:0 auto;padding:0 6vw 90px;display:flex;flex-direction:column;gap:14px;align-items:center;">
  <div class="row" style="display:flex;align-items:center;gap:10px;font-size:15px;color:var(--cream);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gold-2)" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>
    <span class="selectable" id="contactPhone">...</span>
  </div>
  <div class="row" style="display:flex;align-items:center;gap:10px;font-size:15px;color:var(--cream);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gold-2)" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
    <a href="#" class="selectable" id="contactEmail">...</a>
  </div>
</div>

<footer>
  <span class="latin footer-brand">ELITEDRESS</span>
  <div class="footer-contact" id="footerContact"></div>
  <p>© 2026 ELITEDRESS. <span data-i18n="footer.rights">جميع الحقوق محفوظة.</span></p>
</footer>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1"></script>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
  initNav();

  function socialItemTemplate(link){
    const icon = SOCIAL_ICONS[link.platform];
    const label = socialLabel(link.platform);
    if(!icon) return '';
    return `
      <a href="${link.url}" class="social-item" target="_blank" rel="noopener" aria-label="${label}">
        <span class="icon-btn">${icon}</span>
        <span>${label}</span>
      </a>`;
  }

  (async function init(){
    const settings = await getSettings();

    document.getElementById('headerWhatsapp').href = buildWhatsAppLink(settings.buy_phone, t('whatsapp.general_inquiry'));

    const grid = document.getElementById('socialGrid');
    const links = settings.social_links || [];
    grid.innerHTML = links.length
      ? links.map(socialItemTemplate).join('')
      : `<p class="empty-state">${t('contact.empty_links')}</p>`;

    if(settings.contact_phone) document.getElementById('contactPhone').textContent = settings.contact_phone;
    if(settings.contact_email){
      const emailEl = document.getElementById('contactEmail');
      emailEl.textContent = settings.contact_email;
      emailEl.href = 'mailto:' + settings.contact_email;
    }

    document.getElementById('footerContact').innerHTML = renderFooterContact(settings);

    document.addEventListener('langchange', function(){
      grid.innerHTML = links.length
        ? links.map(socialItemTemplate).join('')
        : `<p class="empty-state">${t('contact.empty_links')}</p>`;
      document.getElementById('footerContact').innerHTML = renderFooterContact(settings);
      document.getElementById('headerWhatsapp').href = buildWhatsAppLink(settings.buy_phone, t('whatsapp.general_inquiry'));
    });
  })();
</script>

</body>
</html>
