<script>
  initNav();

  (async function init(){
    const settings = await getSettings();
    setCartContext(settings.currency, settings.buy_phone);

    document.getElementById('headerWhatsapp').href = buildWhatsAppLink(settings.buy_phone, t('whatsapp.general_inquiry_collection'));
    document.addEventListener('langchange', function(){
      document.getElementById('headerWhatsapp').href = buildWhatsAppLink(settings.buy_phone, t('whatsapp.general_inquiry_collection'));
      document.getElementById('footerContact').innerHTML = renderFooterContact(settings);
    });

    document.getElementById('footerContact').innerHTML = renderFooterContact(settings);
  })();
</script>
